[project]
name = "parallels-pro-mcp-server"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server for Parallels Desktop VM automation, lifecycle, execution, snapshots, and screenshots on macOS."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Jarod Wong" }
]
keywords = [
    "mcp",
    "parallels",
    "virtualization",
    "ai",
    "llm",
    "automation",
    "macos",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "mcp>=2.0,<3",
    "pydantic>=2.0,<3",
]

[project.scripts]
parallels-pro-mcp = "parallels_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parallels_mcp"]
